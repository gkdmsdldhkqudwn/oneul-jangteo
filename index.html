
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘장터 | 완주 로컬푸드</title>
<style>
:root {
  --green:#397b4b;
  --dark:#203c2b;
  --pale:#e8f3e5;
  --bg:#f5f7f1;
  --orange:#f06a45;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:#26372b;
  font-family:Arial,"Malgun Gothic",sans-serif;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
header {
  background:white;
  padding:20px;
  border-bottom:1px solid #e8ece5;
  position:sticky;
  top:0;
  z-index:5;
}
.header-inner,.container {
  max-width:900px;
  margin:auto;
}
.logo { font-size:27px; font-weight:800; color:var(--green); }
.subtitle { color:#777; margin-top:7px; }
.container { padding:20px 16px 100px; }
.search {
  width:100%; padding:15px 18px;
  border:0; border-radius:15px;
  background:#fff; outline-color:var(--green);
}
.hero {
  background:var(--pale);
  border-radius:23px;
  padding:27px;
  margin:18px 0 28px;
}
.hero small { color:var(--green); font-weight:bold; }
.hero h1 { font-size:27px; line-height:1.4; margin:10px 0; }
.hero p { color:#607463; margin-bottom:0; }
.section-title {
  display:flex; align-items:center;
  justify-content:space-between; gap:10px;
  margin:28px 0 15px;
}
.section-title h2 { font-size:21px; margin:0; }
.categories {
  display:flex; gap:9px; overflow-x:auto;
  padding:3px 0 12px;
}
.chip {
  white-space:nowrap; border:1px solid #dce5d9;
  background:white; color:#526354;
  border-radius:30px; padding:10px 15px;
}
.chip.active { background:var(--green); color:white; border-color:var(--green); }
.toolbar {
  display:flex; justify-content:space-between;
  align-items:center; gap:8px; margin-bottom:15px;
}
.toolbar select {
  border:1px solid #dce5d9; background:white;
  padding:10px; border-radius:10px; max-width:58%;
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.card {
  background:white; border-radius:17px;
  overflow:hidden; border:1px solid #edf0e9;
  min-width:0;
}
.product-picture {
  height:145px; display:flex; align-items:center;
  justify-content:center; background:#eff3eb;
  font-size:64px; position:relative;
}
.sale {
  position:absolute; left:9px; top:9px;
  background:#fff0e8; color:#e45734;
  border-radius:8px; padding:5px 7px;
  font-size:12px; font-weight:bold;
}
.card-info { padding:13px; }
.card h3 { font-size:16px; margin:0 0 8px; }
.location { color:#7d887c; font-size:13px; margin-bottom:12px; }
.old-price { color:#999; text-decoration:line-through; font-size:13px; }
.price { font-size:19px; font-weight:bold; margin:5px 0; }
.stock { color:#788477; font-size:12px; margin:8px 0; }
.add {
  width:100%; padding:10px 4px; border:0;
  border-radius:10px; color:white; background:var(--green);
  font-weight:bold;
}
.add:active { transform:scale(.98); }
.empty {
  grid-column:1/-1; padding:40px 10px;
  text-align:center; color:#788477; background:white;
  border-radius:15px;
}
.bottom {
  position:fixed; bottom:0; left:0; right:0;
  background:#fff; border-top:1px solid #e5e9e2;
  display:flex; justify-content:center; z-index:6;
}
.bottom button {
  flex:1; max-width:180px; padding:12px 3px;
  background:white; border:0; color:#526354;
  font-size:13px;
}
.bottom span { display:block; font-size:22px; margin-bottom:3px; }
.cart-count { color:var(--orange); font-weight:bold; }
.notice { color:#788477; font-size:12px; line-height:1.6; margin-top:25px; }
@media(max-width:540px) {
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .product-picture { height:125px; font-size:55px; }
  .card-info { padding:11px; }
  .hero h1 { font-size:24px; }
  .card h3 { font-size:14px; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">🥕 오늘장터</div>
    <div class="subtitle">📍 완주군 로컬푸드</div>
  </div>
</header>

<main class="container">
  <input id="search" class="search" type="search"
    placeholder="🔍 농산물 이름을 검색해 보세요">

  <section class="hero">
    <small>TODAY LOCAL FOOD</small>
    <h1>오늘 수확한 농산물,<br>오늘 더 저렴하게!</h1>
    <p>지역 농가와 소비자를 연결하는 로컬푸드 플랫폼</p>
  </section>

  <div class="section-title">
    <h2>🌱 어떤 농산물을 찾으세요?</h2>
  </div>
  <nav id="categories" class="categories"></nav>

  <div class="section-title">
    <h2 id="listTitle">🔥 오늘의 특가</h2>
    <button id="discountOnly" class="chip">할인 상품만</button>
  </div>

  <div class="toolbar">
    <span id="resultCount">상품 0개</span>
    <select id="sort" aria-label="상품 정렬">
      <option value="default">기본순</option>
      <option value="low">가격 낮은순</option>
      <option value="high">가격 높은순</option>
      <option value="discount">할인율 높은순</option>
    </select>
  </div>

  <section id="products" class="grid"></section>
  <p class="notice">
    ※ 현재 상품과 가격은 기능 확인을 위한 예시입니다.
    실제 판매 상품·재고·할인 정보와는 연결되어 있지 않습니다.
  </p>
</main>

<nav class="bottom">
  <button id="home"><span>🏠</span>홈</button>
  <button id="cart"><span>🛒</span>장바구니 <b id="cartCount" class="cart-count">0</b></button>
  <button id="discountNav"><span>🏷️</span>오늘의 할인</button>
</nav>

<script>
const products = [
  {id:1,name:"완주 감자 3kg",category:"감자·고구마",emoji:"🥔",price:3000,original:6000,stock:8},
  {id:2,name:"완주 토마토 2kg",category:"채소",emoji:"🍅",price:3500,original:5000,stock:5},
  {id:3,name:"찰옥수수 10개",category:"곡물",emoji:"🌽",price:4000,original:5000,stock:6},
  {id:4,name:"싱싱한 당근 1kg",category:"채소",emoji:"🥕",price:2500,original:3500,stock:12},
  {id:5,name:"달콤한 사과 1kg",category:"과일",emoji:"🍎",price:5000,original:6500,stock:9},
  {id:6,name:"신선한 양파 2kg",category:"채소",emoji:"🧅",price:2800,original:2800,stock:10},
  {id:7,name:"고구마 2kg",category:"감자·고구마",emoji:"🍠",price:4500,original:6000,stock:7},
  {id:8,name:"쌀 4kg",category:"곡물",emoji:"🌾",price:12000,original:14000,stock:4},
  {id:9,name:"싱싱한 딸기 500g",category:"과일",emoji:"🍓",price:6000,original:8000,stock:3}
];

const categories = ["전체","감자·고구마","채소","과일","곡물","기타"];
let selectedCategory = "전체";
let onlyDiscount = false;
let cart = {};
let cartView = false;

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";
const discount = p => p.original > p.price
  ? Math.round((1-p.price/p.original)*100) : 0;

function renderCategories() {
  $("categories").innerHTML = categories.map(c =>
    `<button class="chip ${c===selectedCategory?"active":""}"
      data-category="${c}">${c}</button>`
  ).join("");
}

function renderProducts() {
  let list = products.filter(p =>
    (selectedCategory==="전체" || p.category===selectedCategory) &&
    (!onlyDiscount || discount(p)>0) &&
    p.name.toLowerCase().includes($("search").value.trim().toLowerCase())
  );

  const sort = $("sort").value;
  if(sort==="low") list.sort((a,b)=>a.price-b.price);
  if(sort==="high") list.sort((a,b)=>b.price-a.price);
  if(sort==="discount") list.sort((a,b)=>discount(b)-discount(a));

  $("listTitle").textContent = cartView ? "🛒 장바구니" :
    onlyDiscount ? "🏷️ 할인 상품" :
    selectedCategory==="전체" ? "🔥 오늘의 특가" : "🌱 "+selectedCategory;
  $("resultCount").textContent = cartView ? "담은 상품" : `상품 ${list.length}개`;

  if(cartView) {
    list = products.filter(p => (cart[p.id]||0)>0);
  }

  if(list.length===0) {
    $("products").innerHTML = `<div class="empty">${
      cartView ? "장바구니가 비어 있어요 🛒" : "검색 결과가 없어요. 다른 종류를 찾아보세요."
    }</div>`;
    if(cartView) $("resultCount").textContent = "총 0원";
    return;
  }

  if(cartView) {
    const total = list.reduce((sum,p)=>sum+p.price*cart[p.id],0);
    $("resultCount").textContent = "합계 "+won(total);
  }

  $("products").innerHTML = list.map(p => {
    const d = discount(p);
    return `<article class="card">
      <div class="product-picture">
        ${d ? `<span class="sale">${d}% 할인</span>` : ""}
        ${p.emoji}
      </div>
      <div class="card-info">
        <h3>${p.name}</h3>
        <div class="location">📍 완주군 · ${p.category}</div>
        ${d ? `<div class="old-price">${won(p.original)}</div>` : ""}
        <div class="price">${won(p.price)}</div>
        <div class="stock">남은 수량 ${p.stock}개</div>
        ${cartView
          ? `<div class="stock">장바구니 수량: ${cart[p.id]}개</div>
             <button class="add" data-remove="${p.id}">1개 빼기</button>`
          : `<button class="add" data-add="${p.id}">＋ 장바구니 담기</button>`}
      </div>
    </article>`;
  }).join("");
}

function updateCartCount() {
  $("cartCount").textContent = Object.values(cart).reduce((a,b)=>a+b,0);
}

$("categories").addEventListener("click",e=>{
  const b=e.target.closest("[data-category]");
  if(!b) return;
  selectedCategory=b.dataset.category;
  cartView=false;
  renderCategories(); renderProducts();
});
$("products").addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  const remove=e.target.closest("[data-remove]");
  if(add) {
    const id=Number(add.dataset.add);
    const p=products.find(x=>x.id===id);
    if((cart[id]||0)>=p.stock) {
      alert("현재 등록된 수량만큼 담았어요."); return;
    }
    cart[id]=(cart[id]||0)+1;
    updateCartCount(); renderProducts();
  }
  if(remove) {
    const id=Number(remove.dataset.remove);
    cart[id]--;
    if(cart[id]<=0) delete cart[id];
    updateCartCount(); renderProducts();
  }
});
$("search").addEventListener("input",()=>{cartView=false;renderProducts();});
$("sort").addEventListener("change",renderProducts);
$("discountOnly").addEventListener("click",()=>{
  onlyDiscount=!onlyDiscount;
  cartView=false;
  $("discountOnly").classList.toggle("active",onlyDiscount);
  renderProducts();
});
$("home").addEventListener("click",()=>{
  selectedCategory="전체"; onlyDiscount=false; cartView=false;
  $("search").value="";
  $("discountOnly").classList.remove("active");
  renderCategories(); renderProducts();
});
$("cart").addEventListener("click",()=>{
  cartView=true; renderProducts();
});
$("discountNav").addEventListener("click",()=>{
  onlyDiscount=true; cartView=false;
  $("discountOnly").classList.add("active");
  renderProducts();
});

renderCategories();
renderProducts();
updateCartCount();
</script>
</body>
</html>
